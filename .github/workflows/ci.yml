name: CI
on:
  push:
  pull_request:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja libomp sdl2

      - name: Install Ninja (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libsdl2-dev libgl-dev xvfb

      - name: Install Ninja (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - name: MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        run: |
          case "${{ runner.os }}" in
            Linux)   preset=linux-release ;;
            macOS)   preset=macos-release ;;
            Windows) preset=windows-release ;;
          esac
          echo "PRESET=$preset" >> "$GITHUB_ENV"
          extra=""
          if [ "${{ runner.os }}" = "macOS" ]; then extra="-DOpenMP_ROOT=$(brew --prefix libomp)"; fi
          cmake --preset "$preset" -DPF_WARNINGS_AS_ERRORS=ON $extra

      - name: Build
        shell: bash
        run: cmake --build --preset "$PRESET"

      - name: Test
        shell: bash
        run: ctest --preset "$PRESET"

      # Open the real window on a virtual display for a few seconds of frames.
      - name: UI smoke run (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a -s "-screen 0 1600x900x24" \
            build/linux-release/pokerforge --frames 120 --advance 3 --players 6 --seed 1 \
            --screenshot "$RUNNER_TEMP/ui.ppm"
          test -s "$RUNNER_TEMP/ui.ppm"
          # Real SDL key and drop events, a live theme switch and a dialog, in one run.
          xvfb-run -a -s "-screen 0 1600x900x24" \
            build/linux-release/pokerforge --frames 150 --players 5 --fold 2 --seed 3 \
            --press f3,f3,f2,ctrl+e --drop rules/short_deck_36.json --toggle-theme-at 40 \
            --screenshot "$RUNNER_TEMP/ui2.ppm"
          test -s "$RUNNER_TEMP/ui2.ppm"

      # Throughput varies across runners, so the benchmark reports but never fails the build.
      - name: Benchmark
        shell: bash
        continue-on-error: true
        run: ctest --preset "$PRESET" -C Exhaustive -R benchmark --verbose

      - name: Package
        shell: bash
        run: cmake --build --preset "$PRESET" --target package

      - uses: actions/upload-artifact@v4
        with:
          name: PokerForge-${{ runner.os }}
          path: |
            build/*/PokerForge-*.tar.gz
            build/*/PokerForge-*.zip
          if-no-files-found: error
